[package]
name = "landc-file-master"
version = "0.1.0"
description = "Landc 文件大师 - 批量改名 / 时间属性 / 元数据编辑"
authors = ["Landc"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "landc_file_master_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 这行不能删。Tauri 2 用 `custom-protocol` 区分开发/生产：
#   无此 feature -> cfg(dev) 成立 -> 加载 devUrl（连 Vite 开发服务器）
#   有此 feature -> 加载 frontendDist（把 dist 内嵌进 exe）
# 注意：这里**故意不放进 default**。`tauri build` 会自动加 --features custom-protocol，
# `tauri dev` 则不加（保持热更新）。若写进 default，tauri dev 也会变成加载内嵌资源。
# 结论：构建 exe 一律用 `npm run build:exe`，不要直接 cargo build --release。
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
walkdir = "2"
rayon = "1"
filetime = "0.2"
chrono = "0.4"
regex = "1"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
anyhow = "1"
thiserror = "1"

# --- 元数据相关（第二阶段启用，先注释避免首次 cargo check 拉一堆依赖） ---
# lofty = "0.21"          # 音频标签 ID3 / FLAC / MP4
# lopdf = "0.34"          # PDF Info 字典
# zip = "2"               # OOXML(docx/xlsx/pptx) 容器
# quick-xml = "0.37"      # docProps/core.xml 读写
# kamadak-exif = "0.6"    # 图片 EXIF

# Windows API 直接在 times.rs / attrs.rs 里声明 kernel32 的 extern "system"，
# 不引入 windows / windows-sys —— 后者每次大版本都会改参数类型别名，容易编译翻车。

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
incremental = false
